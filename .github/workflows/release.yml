name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install libtorrent-rasterbar boost

      - name: Verify release version
        shell: bash
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Sources/Info.plist)"
          BUILD_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Sources/Info.plist)"
          test "$GITHUB_REF_NAME" = "v$VERSION"
          test "$VERSION" = "3.0.0"
          test "$BUILD_VERSION" = "3.0.0"

      - name: Run tests
        run: swift test

      - name: Build release packages
        run: ./package_release.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/Canopy-3.0.0-macOS.zip" \
            "dist/Canopy-3.0.0-macOS.dmg" \
            "dist/Canopy-3.0.0-SHA256SUMS.txt" \
            --title "Canopy 3.0.0" \
            --generate-notes
